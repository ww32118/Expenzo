spring.application.name=Expenzo

spring.datasource.url=jdbc:mysql://localhost:3306/expenzo
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ⚠️ spring.datasource.username and spring.datasource.password
#    are in application-local.properties (gitignored)

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

#spring.security.user.name=admin
#spring.security.user.password=admin123

logging.level.org.springframework.security=TRACE
logging.level.org.springframework.web=DEBUG

jwt.expiration=3600000

spring.security.oauth2.client.registration.google.scope=openid,profile,email
spring.security.oauth2.client.provider.google.authorization-uri=https://accounts.google.com/o/oauth2/v2/auth
spring.security.oauth2.client.provider.google.token-uri=https://oauth2.googleapis.com/token
spring.security.oauth2.client.provider.google.user-info-uri=https://openidconnect.googleapis.com/v1/userinfo
spring.security.oauth2.client.provider.google.user-name-attribute=sub

# Frontend URL (change in production)
app.frontend.url=http://localhost:5173

# ═══════════════════════════════════════════════
# EMAIL CONFIGURATION (Gmail)
# ═══════════════════════════════════════════════

spring.mail.host=smtp.gmail.com
spring.mail.port=587

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000

spring.task.scheduling.enabled=true

spring.profiles.active=local